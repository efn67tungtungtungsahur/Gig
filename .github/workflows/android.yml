name: Android-App bauen

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk gig.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gig-apk
          path: gig.apk

      - name: Als Download (Release) veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Gig App (neueste Version)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: gig.apk
          body: |
            Handy-App für den Gig-Giveaway-Bot.
            Auf dem Handy `gig.apk` herunterladen und öffnen (Installation aus unbekannten Quellen erlauben).
            Anleitung: siehe README im Repository.
